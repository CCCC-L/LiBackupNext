[package]
name = "rustic_bridge"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "rustic_bridge"
crate-type = ["cdylib"]

[dependencies]
jni = "0.22.4"
rustic_core = "0.13.0"
rustic_backend = { version = "0.7.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
libc = "0.2"
jiff = "0.2"

[profile.release]
lto = "fat"
strip = "symbols"
opt-level = "s"
codegen-units = 1
panic = "abort"
