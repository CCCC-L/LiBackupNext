name: Build & Release

# 打 tag 自动发包：v1.2.3 和 1.2.3，也可以手动指定版本号
on:
  push:
    tags:
      # v 开头的（v1.2.3）
      - "v[0-9]*"
      # 纯版本号（1.2.3）
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "输入版本号(不带V)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      NDK_VERSION: "30.0.16248370"
      # compileSdk 37 + AGP 9 需要 JDK 17 以上
      JAVA_VERSION: "21"

    steps:
      # 生成变更日志要读历史，必须完整 clone
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
          accept-android-sdk-licenses: true

      - name: 接受 SDK 许可
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: 安装 NDK 与平台
        run: |
          set -e
          sdkmanager --install "ndk;$NDK_VERSION" > /dev/null

          # compileSdk 37 的平台包在不同 SDK 版本里叫 android-37 或 android-37.0，
          # 两个都试一遍，装不上就让 AGP 自己下载
          sdkmanager --install "platforms;android-37" > /dev/null 2>&1 \
            || sdkmanager --install "platforms;android-37.0" > /dev/null 2>&1 \
            || true

          # buildRust 任务优先读这个环境变量（CI 上没有 local.properties）
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 缓存 Rust 产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src/main/rustic_bridge

      - name: 安装 cargo-ndk
        run: cargo install cargo-ndk

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 计算版本号
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # tag 触发：v1.2.3 和 1.2.3 都支持，去掉可能的前缀 v
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          # 匹配 1.2.3 这样的版本号
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本号「$VERSION」不合法，应为 1.2.3 或 v1.2.3"
            exit 1
          fi

          # versionCode 用 major*10000 + minor*100 + patch，保证单调递增
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          PATCH="${PATCH%%[!0-9]*}"
          CODE=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "版本 $VERSION（versionCode=$CODE）"

      - name: 打包 release
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease \
            -PrustAbis=arm64-v8a \
            -PversionName=${{ steps.ver.outputs.version }} \
            -PversionCode=${{ steps.ver.outputs.code }} \
            --no-daemon --stacktrace

      - name: 签名
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          VERSION="${{ steps.ver.outputs.version }}"
          IN=app/build/outputs/apk/release/app-release-unsigned.apk
          OUT="LiBackupNext-${VERSION}.apk"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
            APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
            "$APKSIGNER" sign \
              --ks /tmp/release.keystore \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --out "$OUT" "$IN"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            # 没配 secrets 也能出包，只是装不上（Android 要求签名）
            cp "$IN" "$OUT"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置签名 secrets，产物是未签名 APK"
          fi

          sha256sum "$OUT" | tee "$OUT.sha256"
          ls -lh "$OUT"

      - name: 生成变更日志
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          APK="LiBackupNext-${VERSION}.apk"

          # 上一次发版打的 tag（不含本次）。HEAD 就是本次 tag 的提交，
          # 从 HEAD^ 往前找最近的 tag，拿到的就是「上回打包」那个点。
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            # 只取「上次发版 → 这次发版」之间的提交
            LOG=$(git log "$PREV..HEAD" --no-merges --pretty=format:'%h%x09%s')
          else
            # 首次发版，没有可对比的区间，就把全部提交都列出来
            LOG=$(git log --no-merges --pretty=format:'%h%x09%s')
          fi

          # 按 Conventional Commits 的类型分组：feat / fix / chore …
          # TYPES 的顺序就是输出顺序，没写类型前缀的落到最后的「其他」
          TYPES=(feat fix perf refactor style docs test build ci chore revert)
          declare -A TITLE=(
            [feat]="新功能" [fix]="修复" [perf]="性能" [refactor]="重构"
            [style]="样式" [docs]="文档" [test]="测试" [build]="构建"
            [ci]="CI" [chore]="杂项" [revert]="回滚"
          )
          declare -A BUCKET=()

          while IFS=$'\t' read -r HASH SUBJECT; do
            if [ -z "${HASH:-}" ]; then continue; fi

            TYPE="other"
            BODY="$SUBJECT"
            # 解析 "type(scope)!: subject"
            if [[ "$SUBJECT" =~ ^([A-Za-z]+)(\([^\)]*\))?!?:[[:space:]]*(.+)$ ]]; then
              CAND=$(printf '%s' "${BASH_REMATCH[1]}" | tr '[:upper:]' '[:lower:]')
              case "$CAND" in
                feat|fix|perf|refactor|style|docs|test|build|ci|chore|revert)
                  TYPE="$CAND"
                  BODY="${BASH_REMATCH[3]}"
                  ;;
              esac
            fi
            BUCKET[$TYPE]+="- ${BODY}（\`${HASH}\`）"$'\n'
          done <<< "$LOG"

          {
            echo "## 变更"
            echo
            COUNT=0
            for t in "${TYPES[@]}"; do
              if [ -n "${BUCKET[$t]:-}" ]; then
                echo "### ${TITLE[$t]}"
                echo
                printf '%s' "${BUCKET[$t]}"
                echo
                COUNT=$((COUNT + 1))
              fi
            done
            if [ -n "${BUCKET[other]:-}" ]; then
              echo "### 其他"
              echo
              printf '%s' "${BUCKET[other]}"
              echo
              COUNT=$((COUNT + 1))
            fi
            if [ "$COUNT" -eq 0 ]; then
              echo "- 无"
              echo
            fi
          } > release-body.md

          cat release-body.md

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: LiBackupNext-${{ steps.ver.outputs.version }}
          path: |
            LiBackupNext-${{ steps.ver.outputs.version }}.apk
            LiBackupNext-${{ steps.ver.outputs.version }}.apk.sha256
          if-no-files-found: error

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          # 手动触发时用计算出来的版本号建 tag，tag 触发时用原 tag
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', steps.ver.outputs.version) || github.ref_name }}
          name: LiBackupNext v${{ steps.ver.outputs.version }}
          body_path: release-body.md
          files: |
            LiBackupNext-${{ steps.ver.outputs.version }}.apk
            LiBackupNext-${{ steps.ver.outputs.version }}.apk.sha256
          draft: false
          prerelease: false
